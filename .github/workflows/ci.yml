name: Repository checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: repository-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NODE_ENV: test
      MONGODB_URI: mongodb://127.0.0.1:27017/hellorun_ci_unreachable
      DATABASE_URL: ""
      REDIS_URL: ""
      SESSION_SECRET: ci-only-not-a-production-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies without lifecycle network calls
        run: npm ci --ignore-scripts
      - name: Syntax and template checks
        run: npm run lint:check
      - name: Non-rewriting format checks
        run: npm run format:check
      - name: Documentation audit
        run: npm run docs:check
      - name: DB-free unit suite
        run: npm run test:unit
